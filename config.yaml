# Options Alert System configuration
# Tune these to your account and taste. Nothing here places real orders --
# this whole system is decision support / alerts only.

account:
  # Your actual account value. Used only to size suggested contract counts
  # and cap risk per idea -- this system never reads your real balance.
  portfolio_value: 500.0
  # Max % of portfolio_value to risk on a single trade idea.
  max_risk_per_trade_pct: 0.20
  # Never suggest more than this many open ideas at once (diversification floor
  # for an account this small is weak, but this stops going all-in on one name).
  max_open_positions: 3
  # Skip any idea whose total contract cost exceeds this many dollars,
  # even if max_risk_per_trade_pct would technically allow more.
  max_trade_cost_usd: 150.0
  # Diversification guard: skip a candidate idea if its underlying's daily
  # returns are this correlated (Pearson, trailing ~60 days) or more with
  # an already-accepted idea in the SAME direction. Stops all 3 open slots
  # from secretly being the same bet (e.g. three EV names that move
  # together). Correlated ideas in OPPOSITE directions aren't flagged --
  # that's a hedge, not redundancy.
  max_correlation: 0.7
  # Confidence-weighted sizing: a marginal setup (RSI near the edge of its
  # band, volatility percentile near the cap) gets this fraction of the
  # normal risk budget; a clean, centered setup gets the full 100%. This
  # scales the SAME per-trade caps above -- it never raises them.
  confidence_size_floor_pct: 0.7

market_regime:
  # "Don't fight the tape": skip a bullish idea if the broad market itself
  # is in a downtrend that day (and skip bearish ideas if the market is in
  # an uptrend), even if the individual ticker looks fine on its own. Uses
  # the exact same trend signal (fast/slow SMA vs price) already used
  # per-ticker, just applied to reference_ticker instead. If the market
  # itself has no clear trend, nothing is restricted.
  enabled: true
  reference_ticker: "SPY"

watchlist:
  # Liquid, optionable, cheap-enough-premium names. Edit freely.
  # Cheap-underlying names are included because $500 accounts need low
  # dollar premiums to get more than one shot at a trade.
  # SPY is included too -- its own trend/RSI/volatility get screened for a
  # tradeable idea just like every other name below, on top of already
  # being used as the market_regime.reference_ticker for the "don't fight
  # the tape" filter. SPY's per-contract premium is pricier than the
  # cheap-underlying names above, so most SPY ideas here will come out as
  # a debit spread to fit the account's per-trade budget.
  - SPY
  - SOFI
  - F
  - PLTR
  - NIO
  - AAL
  - INTC
  - RIVN
  - PLUG
  - SIRI
  - T

strategy:
  # Target days-to-expiration window for new entries. 30-45 DTE balances
  # theta decay against having enough time for a thesis to play out.
  min_dte: 25
  max_dte: 50
  # Target delta band (absolute value) for the "long leg" of a trade.
  long_leg_delta_min: 0.35
  long_leg_delta_max: 0.60
  # Target delta for the short leg when a debit spread is used to cut cost.
  short_leg_delta_min: 0.15
  short_leg_delta_max: 0.30
  # Technical filters
  rsi_period: 14
  rsi_bull_min: 45
  rsi_bull_max: 75
  rsi_bear_min: 25
  rsi_bear_max: 55
  sma_fast: 20
  sma_slow: 50
  # Historical-volatility percentile (1yr lookback) used as an IV-rank proxy.
  # We prefer buying premium when IV is NOT already elevated.
  iv_rank_max_pct: 65
  # Minimum open interest / volume for a contract to be considered liquid
  # enough to actually trade on Robinhood without garbage fills.
  min_open_interest: 100
  min_volume: 10
  max_bid_ask_spread_pct: 0.15
  # Skip a trade if the underlying's next earnings report is expected to
  # land before the option expires -- a long option bought into earnings
  # is exposed to a same-day IV crush that can wipe out the premium even
  # if the direction call turns out right.
  avoid_earnings: true

exits:
  # Classic long-premium risk management: take profit early, cut losses hard,
  # and always exit before theta decay accelerates near expiration.
  profit_target_pct: 0.60
  stop_loss_pct: 0.50
  # How the "time to close" trigger decides it's time, regardless of P/L:
  #   "calendar"  -- close once DTE remaining <= close_by_dte (simple, the
  #                  same rule for every position no matter its actual decay)
  #   "theta_pct" -- close once the position's daily time-decay reaches
  #                  theta_pct_of_value of its current value, no matter the
  #                  DTE -- an ATM option decaying fast at 20 DTE would
  #                  trigger sooner than a slow-decaying one still at 8 DTE
  exit_rule_mode: "calendar"
  close_by_dte: 10
  theta_pct_of_value: 0.05

data:
  price_history_period: "1y"
  cache_dir: "data_cache"

alerts:
  log_dir: "logs"
  # Also write a markdown daily report in addition to the CSV log.
  write_markdown: true

notifications:
  # Email delivery is off -- no Gmail OAuth credentials configured. The
  # scan still runs and writes logs/report_YYYY-MM-DD.md every time;
  # check that file directly instead of getting an email.
  enabled: false
  to_email: "mattc423542@gmail.com"
  # Include hold/take-profit/stop-loss/time-exit guidance on tracked open
  # positions in the same daily email as the new-idea scan.
  include_position_checks: true
  # Send an email even on days with no new ideas and no open positions
  # (otherwise you only hear from it when there's something to look at).
  send_on_empty: false
  # Include the `hot` most-active-options ranking in the same daily email.
  include_hot_list: true

most_active:
  # `python main.py hot` ranks this universe by today's near-term options
  # volume and shows the top N. This is a SEPARATE list from `watchlist`
  # above -- it's for discovery, not trading. There's no free market-wide
  # "most active options" feed, so this is an approximation: options volume
  # summed across the nearest expiration only, for a curated list of
